<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naše Taichi Online — cvičení</title>
    <meta name="description" content="Videa s tchaj-ťi sestavami: Sestava 8 pohybů, 13 forem, meditace s dlaněmi. Cvičte společně, pohodlně z domova.">
    <meta property="og:title" content="Naše Taichi Online">
    <meta property="og:description" content="Videa s tchaj-ťi sestavami: Sestava 8 pohybů, 13 forem, meditace s dlaněmi.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nasetaichi.online/">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%90%B4%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="video-container">
    <video id="videoPlayer1" class="video-player active" muted playsinline preload="auto"
           src="https://owncloud.cesnet.cz/index.php/s/LoOW6Af0G9jOqKd/download"></video>
    <video id="videoPlayer2" class="video-player" muted playsinline preload="auto"></video>

    <div class="spinner" id="spinner" aria-hidden="true"></div>

    <div class="error-overlay" id="errorOverlay" hidden>
        <p>Video se nepodařilo načíst.</p>
        <button id="retryButton" type="button">Zkusit znovu</button>
    </div>

    <div class="navigation-buttons">
        <button id="prevButton" class="nav-btn prev-btn" type="button" aria-label="Předchozí video">◀</button>
        <button id="nextButton" class="nav-btn next-btn" type="button" aria-label="Další video">▶</button>
    </div>

    <div class="bottom-bar">
        <div class="controls-row">
            <button id="playPauseButton" class="ctl-btn" type="button" aria-label="Přehrát / pozastavit">⏸</button>
            <button id="muteButton" class="ctl-btn" type="button" aria-label="Zapnout / ztlumit zvuk" aria-pressed="false">🔇</button>
            <span id="videoDescription" class="description" aria-live="polite">Sestava 8 pohybů</span>
            <button id="menuToggleButton" class="ctl-btn" type="button" aria-label="Seznam kapitol" aria-expanded="false" aria-controls="chapterMenu">☰</button>
        </div>
        <div id="chapterMenu" class="chapter-menu" hidden></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
